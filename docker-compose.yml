services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novamart
      POSTGRES_PASSWORD: novamart
      POSTGRES_DB: novamart
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novamart"]
      interval: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://novamart:novamart@db:5432/novamart
      JWT_SECRET: local-dev-secret
      TEST_RESET_KEY: local-reset-key
    ports: ["4000:4000"]
volumes:
  pgdata:
