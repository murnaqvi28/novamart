openapi: 3.0.3
info:
  title: NovaMart API
  version: 1.0.0
  description: |
    REST API for the NovaMart online store.

    **Auth:** call `POST /api/auth/login`, then send `Authorization: Bearer <token>`.

    **Demo accounts:** `admin@novamart.pk / Admin@123` (admin), `ali@example.com / Customer@123` (customer).

    **Business rules**
    - Currency is PKR. Shipping is PKR 250, free when the subtotal is PKR 5,000 or more.
    - Coupons: `WELCOME10` (10% off, min PKR 2,000), `FLAT500` (PKR 500 off, min PKR 3,000), `EXPIRED20` (expired), `INACTIVE15` (inactive).
    - Card payments are simulated. `4242 4242 4242 4242` succeeds, `4000 0000 0000 0002` is declined, `4000 0000 0000 9995` has insufficient funds. Any future MM/YY expiry and any 3-digit CVV.
    - Successful card orders start as `paid`; cash-on-delivery (`cod`) orders start as `pending`.
    - Order status flow: pending → paid → shipped → delivered. Pending/paid orders can be cancelled (stock is restored).
servers:
  - url: /api
tags:
  - name: System
  - name: Auth
  - name: Catalog
  - name: Cart
  - name: Orders
  - name: Admin
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok }, time: { type: string, format: date-time } } } } } }
  /config:
    get:
      tags: [System]
      summary: Store pricing rules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string, example: PKR }
                  freeShippingThreshold: { type: number, example: 5000 }
                  shippingFee: { type: number, example: 250 }
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, example: Ahmed Ali }
                email: { type: string, format: email, example: ahmed@example.com }
                password: { type: string, minLength: 8, description: Must contain a letter and a number, example: Secret123 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: ali@example.com }
                password: { type: string, example: Customer@123 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /categories:
    get:
      tags: [Catalog]
      summary: List categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }
  /products:
    get:
      tags: [Catalog]
      summary: Search and list products
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Matches name or description }
        - { name: category, in: query, schema: { type: string }, description: Category slug, example: electronics }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: inStock, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: featured, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, name_asc, rating], default: newest } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /products/{idOrSlug}:
    get:
      tags: [Catalog]
      summary: Product details with related products
      parameters: [{ $ref: '#/components/parameters/IdOrSlug' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
                  related: { type: array, items: { $ref: '#/components/schemas/Product' } }
        '404': { $ref: '#/components/responses/Error' }
  /products/{idOrSlug}/reviews:
    get:
      tags: [Catalog]
      summary: List reviews for a product
      parameters: [{ $ref: '#/components/parameters/IdOrSlug' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Review' } } } } } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Catalog]
      summary: Add a review (one per user per product)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdOrSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
                comment: { type: string, minLength: 3, example: Great product! }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Review' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /cart:
    get:
      tags: [Cart]
      summary: Get the current user's cart
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: coupon, in: query, schema: { type: string }, description: Optional coupon to preview totals }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Cart]
      summary: Empty the cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add a product to the cart (adds to existing quantity)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: integer, example: 1 }
                quantity: { type: integer, minimum: 1, maximum: 99, default: 1 }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Error' }
  /cart/items/{productId}:
    patch:
      tags: [Cart]
      summary: Set quantity of a cart item
      security: [{ bearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 1, maximum: 99 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      security: [{ bearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /cart/coupon:
    post:
      tags: [Cart]
      summary: Validate a coupon against the current cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, example: WELCOME10 } } }
      responses:
        '200':
          description: Valid coupon
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  coupon: { type: object, properties: { code: { type: string }, type: { type: string, enum: [percent, fixed] }, value: { type: number } } }
                  totals: { $ref: '#/components/schemas/Totals' }
        '400': { $ref: '#/components/responses/Error' }
  /orders:
    get:
      tags: [Orders]
      summary: List my orders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } } } } } } }
    post:
      tags: [Orders]
      summary: Checkout — place an order from the current cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '402': { $ref: '#/components/responses/Error' }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one of my orders
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel a pending or paid order
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/stats:
    get:
      tags: [Admin]
      summary: Dashboard statistics
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
  /admin/products:
    get:
      tags: [Admin]
      summary: List all products (including inactive)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: search, in: query, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Product' } } } } } } }
    post:
      tags: [Admin]
      summary: Create a product
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /admin/products/{id}:
    put:
      tags: [Admin]
      summary: Update a product
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      summary: Deactivate (soft-delete) a product
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders
      security: [{ bearerAuth: [] }]
      parameters: [{ name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } } } } } } }
  /admin/orders/{id}:
    get:
      tags: [Admin]
      summary: Get any order
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Change order status (enforces allowed transitions)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/OrderStatus' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /test/reset:
    post:
      tags: [System]
      summary: Reset database to seed data (test environments only)
      description: Only enabled when the server has `TEST_RESET_KEY` set. Send the key in the `x-test-reset-key` header.
      parameters: [{ name: x-test-reset-key, in: header, required: true, schema: { type: string } }]
      responses:
        '200': { description: Reset done }
        '404': { description: Disabled or wrong key }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    IdOrSlug: { name: idOrSlug, in: path, required: true, schema: { type: string }, example: aero-wireless-headphones }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: BAD_REQUEST }
            message: { type: string }
            details:
              type: array
              items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, admin] }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        productCount: { type: integer }
    Product:
      type: object
      required: [id, name, slug, price, stock, inStock]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        price: { type: number }
        compareAtPrice: { type: number, nullable: true }
        stock: { type: integer }
        inStock: { type: boolean }
        imageUrl: { type: string, nullable: true }
        isFeatured: { type: boolean }
        isActive: { type: boolean }
        rating: { type: number }
        reviewCount: { type: integer }
        category:
          nullable: true
          type: object
          properties: { id: { type: integer }, name: { type: string }, slug: { type: string } }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, price, stock]
      properties:
        name: { type: string, example: Test Product }
        description: { type: string }
        price: { type: number, example: 1999 }
        compareAtPrice: { type: number, nullable: true, description: Must be greater than price }
        stock: { type: integer, minimum: 0, example: 10 }
        categoryId: { type: integer, nullable: true, example: 1 }
        imageUrl: { type: string, nullable: true }
        isFeatured: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Review:
      type: object
      properties:
        id: { type: integer }
        rating: { type: integer }
        comment: { type: string }
        userName: { type: string }
        createdAt: { type: string, format: date-time }
    Totals:
      type: object
      required: [subtotal, discount, shippingFee, total]
      properties:
        subtotal: { type: number }
        discount: { type: number }
        shippingFee: { type: number }
        total: { type: number }
        couponCode: { type: string, nullable: true }
    CartItem:
      type: object
      properties:
        productId: { type: integer }
        name: { type: string }
        slug: { type: string }
        imageUrl: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        stock: { type: integer }
        available: { type: boolean }
        lineTotal: { type: number }
    Cart:
      type: object
      required: [items, itemCount, totals]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        itemCount: { type: integer }
        totals: { $ref: '#/components/schemas/Totals' }
        couponError: { type: string }
    OrderStatus:
      type: string
      enum: [pending, paid, shipped, delivered, cancelled]
    Shipping:
      type: object
      required: [name, phone, address, city, postalCode]
      properties:
        name: { type: string, example: Ali Raza }
        phone: { type: string, example: '03001234567', description: 'Pakistani mobile: 03XXXXXXXXX or +923XXXXXXXXX' }
        address: { type: string, example: House 12, Street 5, Bahria Town }
        city: { type: string, example: Rawalpindi }
        postalCode: { type: string, example: '46000', description: 5 digits }
    CreateOrder:
      type: object
      required: [shipping, paymentMethod]
      properties:
        shipping: { $ref: '#/components/schemas/Shipping' }
        paymentMethod: { type: string, enum: [cod, card] }
        couponCode: { type: string, nullable: true, example: WELCOME10 }
        card:
          type: object
          description: Required when paymentMethod is card
          required: [number, expiry, cvv, nameOnCard]
          properties:
            number: { type: string, example: '4242424242424242' }
            expiry: { type: string, example: '12/30' }
            cvv: { type: string, example: '123' }
            nameOnCard: { type: string, example: Ali Raza }
    Order:
      type: object
      required: [id, orderNumber, status, total]
      properties:
        id: { type: integer }
        orderNumber: { type: string, example: NM-20261125-AB12CD }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { type: string, enum: [cod, card] }
        cardLast4: { type: string, nullable: true }
        subtotal: { type: number }
        discount: { type: number }
        shippingFee: { type: number }
        total: { type: number }
        couponCode: { type: string, nullable: true }
        shipping: { $ref: '#/components/schemas/Shipping' }
        itemCount: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: integer, nullable: true }
              name: { type: string }
              unitPrice: { type: number }
              quantity: { type: integer }
              lineTotal: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
